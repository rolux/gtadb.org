<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>markers.gtadb.org — My collection — GTA VI</title>
    <meta name="description" content="Your personal GTA map. Save markers and images in your browser, and exchange collections as files.">
    <link rel="icon" href="index.png">
    <link rel="stylesheet" href="https://maps.gtadb.org/ui.css">
    <link rel="stylesheet" href="https://maps.gtadb.org/maps.css">
    <link rel="stylesheet" href="https://maps.gtadb.org/maps3d.css">
    <link rel="stylesheet" href="index.css">
    <script>var gtadb = window.gtadb || {};</script>
    <script defer src="https://maps.gtadb.org/ui.js"></script>
    <script defer src="https://maps.gtadb.org/maps.js"></script>
    <script defer src="https://maps.gtadb.org/maps3dflat.js"></script>
    <script defer src="https://maps.gtadb.org/maps3d.js"></script>
    <script defer src="index.js"></script>
</head>
<body class="light">
    <aside id="listPanel" class="mapPanel" aria-label="Markers">
        <header id="titleBar" class="bar">
            <a id="siteIcon" class="icon" href="https://gtadb.org" title="GTADB.ORG">gtadb</a>
            <button id="collectionIcon" class="icon" title="Manage collections">M</button>
            <span class="spacer"></span>
            <button id="aboutButton">About</button><button id="settingsButton">Settings</button>
        </header>
        <div id="mainBar" class="bar">
            <select id="game" aria-label="Game"><option value="4">GTA IV</option><option value="5">GTA V</option><option value="6" selected>GTA VI</option></select>
            <span class="spacer"></span><button id="dimensionButton" title="Shift+D">3D</button>
        </div>
        <div id="findBar" class="bar"><input id="find" type="search" placeholder="Find" aria-label="Find markers" autocomplete="off" spellcheck="false"><button id="clearFind" hidden>Clear</button></div>
        <div id="filterBar" class="bar"><select id="filter" aria-label="Filter markers"></select><button id="clearFilter" hidden>Clear</button></div>
        <div id="sortBar" class="bar"><select id="sort" aria-label="Sort markers"><option value="name">Sort by name</option><option value="type">Sort by type</option><option value="tags">Sort by tags</option><option value="x">Sort by longitude</option><option value="y">Sort by latitude</option><option value="id">Sort by ID</option><option value="modified">Sort by last edited</option></select></div>
        <div id="listBody" role="listbox" aria-label="Marker list"></div>
        <footer id="listStatusBar" class="bar"><span id="markerCount">Loading…</span><span class="spacer"></span><button id="removeButton" disabled>Remove</button><button id="addButton" title="Add a marker at the center of the map (A)">Add</button></footer>
    </aside>
    <aside id="itemPanel" class="mapPanel" aria-label="Selected marker" hidden>
        <header class="bar"><span id="itemId"></span><span class="spacer"></span><button id="editButton">Edit</button><button id="closeItem">Close</button></header>
        <div id="itemBody"></div>
    </aside>
    <div id="coordinatesPanel" class="mapPanel rounded"><span id="coordinates"></span></div>
    <button id="showUI" hidden>Show UI</button>
    <div id="notice" role="status" hidden></div>
    <input id="importFile" type="file" accept=".gtadbmarkers,.zip,application/zip" hidden>
    <noscript>This map needs JavaScript to store and display your markers.</noscript>
</body>
</html>
